plugins {
    id 'java'
}

group = 'dev.c0redev'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://repo.xenondevs.xyz/releases/' }
}

sourceSets {
    wailaGenerator {
        java.srcDir 'src/wailaGenerator/java'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.7.0'
    wailaGeneratorImplementation 'xyz.xenondevs:minecraft-model-renderer:1.3'
}

def vanillaClientUrl = 'https://piston-data.mojang.com/v1/objects/ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd/client.jar'
def vanillaClientJar = layout.projectDirectory.file('.cache/minecraft-client-1.21.11.jar')
def russianLanguageFile = layout.projectDirectory.file('.cache/ru_ru.json')
def vanillaAssetsDir = layout.buildDirectory.dir('generated/vanilla-assets')
def wailaTextureMap = layout.buildDirectory.file('generated/waila-texture-map.properties')
def wailaRenderedAssetsDir = layout.buildDirectory.dir('generated/waila-rendered-assets')

tasks.register('extractVanillaBlockTextures') {
    outputs.dir(vanillaAssetsDir)

    doLast {
        File clientJar = vanillaClientJar.asFile
        if (!clientJar.exists()) {
            clientJar.parentFile.mkdirs()
            new URL(vanillaClientUrl).withInputStream { input ->
                clientJar.withOutputStream { output -> output << input }
            }
        }

        copy {
            from zipTree(clientJar)
            include 'assets/minecraft/textures/block/**/*.png'
            include 'assets/minecraft/textures/item/**/*.png'
            include 'assets/minecraft/lang/ru_ru.json'
            include 'assets/minecraft/textures/item/apple.png'
            include 'assets/minecraft/textures/item/heart_of_the_sea.png'
            include 'assets/minecraft/textures/item/diamond_pickaxe.png'
            include 'assets/minecraft/textures/item/diamond_axe.png'
            include 'assets/minecraft/textures/item/diamond_shovel.png'
            include 'assets/minecraft/textures/item/shears.png'
            into vanillaAssetsDir
            eachFile { details ->
                details.path = details.path.replaceFirst('assets/minecraft/textures/', 'vanilla-textures/')
            }
            includeEmptyDirs = false
        }
    }
}

def wailaRuMap = layout.buildDirectory.file('generated/waila-ru.properties')

tasks.register('generateWailaRussianMap', Exec) {
    inputs.file(russianLanguageFile)
    inputs.file(file('tools/generate_waila_russian_map.py'))
    outputs.file(wailaRuMap)
    commandLine 'python3', file('tools/generate_waila_russian_map.py').absolutePath,
            russianLanguageFile.asFile.absolutePath, wailaRuMap.get().asFile.absolutePath
}

tasks.register('generateWailaTextureMap', Exec) {
    dependsOn tasks.named('extractVanillaBlockTextures')
    inputs.file(vanillaClientJar)
    inputs.file(file('tools/generate_waila_texture_map.py'))
    outputs.file(wailaTextureMap)
    commandLine 'python3', file('tools/generate_waila_texture_map.py').absolutePath,
            vanillaClientJar.asFile.absolutePath, wailaTextureMap.get().asFile.absolutePath
}

tasks.register('renderWailaAtlas', JavaExec) {
    dependsOn tasks.named('wailaGeneratorClasses')
    dependsOn tasks.named('extractVanillaBlockTextures')
    dependsOn tasks.named('generateWailaTextureMap')
    inputs.file(vanillaClientJar)
    inputs.file(wailaTextureMap)
    outputs.dir(wailaRenderedAssetsDir)
    classpath = sourceSets.wailaGenerator.runtimeClasspath
    mainClass = 'dev.c0redev.someutils.tools.WailaAtlasGenerator'
    args vanillaClientJar.asFile.absolutePath, wailaTextureMap.get().asFile.absolutePath, wailaRenderedAssetsDir.get().asFile.absolutePath
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    options.compilerArgs << '-Xlint:deprecation'
}

processResources {
    dependsOn tasks.named('extractVanillaBlockTextures')
    dependsOn tasks.named('generateWailaTextureMap')
    dependsOn tasks.named('renderWailaAtlas')
    dependsOn tasks.named('generateWailaRussianMap')
    from(vanillaAssetsDir)
    from(wailaTextureMap) {
        rename { 'waila-texture-map.properties' }
    }
    from(wailaRenderedAssetsDir)
    from(wailaRuMap) {
        rename { 'waila-ru.properties' }
    }
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
